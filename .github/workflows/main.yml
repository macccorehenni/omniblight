name: Preview → Production (Digital Garden)

on:
  push:
    branches:
      - 'dependabot/npm_and_yarn/*'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview-and-promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 1) Pull preview env (env vars, config)
      - name: Pull preview env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}[web:17][web:19][web:62]

      # 2) Build preview
      - name: Build preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}[web:17][web:19][web:36]

      # 3) Deploy preview and capture deployment URL
      - name: Deploy preview and capture URL
        id: deploy_preview
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --non-interactive | tail -n 1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_OUTPUT[web:3][web:19][web:31][web:40]

      # 4) Promote that preview deployment to production
      - name: Promote preview to production
        run: vercel promote "${{ steps.deploy_preview.outputs.DEPLOY_URL }}" --yes --non-interactive --token=${{ secrets.VERCEL_TOKEN }}[web:3][web:38][web:40]
