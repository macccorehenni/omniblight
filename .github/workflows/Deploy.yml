name: Vercel Production Deployment (Digital Garden)

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main    # runs when Dependabot PRs or your changes are merged to main

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}[web:17][web:19][web:66]

      - name: Build Digital Garden (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}[web:17][web:19][web:36][web:66][web:34]

      - name: Deploy prebuilt artifacts to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}[web:17][web:19][web:31][web:66][web:34]
